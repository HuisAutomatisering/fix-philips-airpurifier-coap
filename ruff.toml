target-version = "py313"
line-length = 100

[lint]
select = ["B", "E", "F", "I", "UP", "W"]
# Long log messages and comments are left to the formatter (same as Home Assistant core)
ignore = ["E501"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false
