target-version = "py313"
line-length = 100

[lint]
# S = flake8-bandit (security), BLE = no blind "except Exception" without handling
select = ["B", "BLE", "E", "F", "I", "S", "UP", "W"]
# Long log messages and comments are left to the formatter (same as Home Assistant core)
ignore = ["E501"]

[lint.per-file-ignores]
# pytest uses plain assert statements
"tests/**" = ["S101"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false
