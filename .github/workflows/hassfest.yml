name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
