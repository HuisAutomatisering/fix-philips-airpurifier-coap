name: Release

# Builds the integration zip that HACS installs, signs it with a SLSA build
# provenance attestation and attaches both to the GitHub release.
# Runs automatically when a release is published. If the assets are missing
# (for example for a release made earlier), run it by hand: Actions -> Release
# -> Run workflow, and enter the release tag (e.g. v0.39.2).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach assets for (e.g. v0.39.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, attest and upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    env:
      ZIP: philips_airpurifier_local.zip
      COMPONENT: custom_components/philips_airpurifier_local
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check tag format
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.39.2"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check manifest version matches the release tag
        run: |
          version="$(jq -r .version "$COMPONENT/manifest.json")"
          if [ "v$version" != "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::manifest.json version $version does not match release tag $TAG"
            exit 1
          fi
      - name: Build zip
        run: |
          mkdir -p dist
          (cd "$COMPONENT" && zip -r -X "$GITHUB_WORKSPACE/dist/$ZIP" . -x '*/__pycache__/*' '*.pyc')
          sha256sum "dist/$ZIP"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ZIP }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/$ZIP.intoto.jsonl"
          gh release upload "$TAG" "dist/$ZIP" "dist/$ZIP.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### Release assets for $TAG"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
